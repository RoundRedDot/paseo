appId: sh.paseo
---
- runFlow:
    when:
      visible: "^(打开|Open)$"
    commands:
      - tapOn: "^(打开|Open)$"
- runFlow:
    when:
      visible: "^(不允许|Don’t Allow|Don't Allow)$"
    commands:
      - tapOn: "^(不允许|Don’t Allow|Don't Allow)$"
- extendedWaitUntil:
    visible: "^(正在加载 workspace|Loading workspace)$"
    timeout: 15000
- assertNotVisible:
    id: message-input-root
- takeScreenshot: loading-before-menu
